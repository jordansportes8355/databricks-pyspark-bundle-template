_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.3.0"

# ── Project identity ──────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Customer Churn Prediction')"
  validator: >-
    {% if not project_name.strip() %}Project name cannot be empty{% endif %}
    {%- if '"' in project_name %}Project name cannot contain double quotes{% endif %}

project_slug:
  type: str
  help: "Bundle / repo slug — lowercase, alphanumeric, dashes only"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}
    Must start with a letter and contain only lowercase letters, digits and dashes
    {% endif %}

package_name:
  type: str
  help: "Python package name (snake_case, no dashes)"
  default: "{{ project_slug | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be a valid Python identifier: lowercase letters, digits and underscores
    {% endif %}

author_name:
  type: str
  help: "Your full name"

author_email:
  type: str
  help: "Your email address (receives job failure notifications)"
  validator: >-
    {% if not (author_email | regex_search('^[^@ ]+@[^@ ]+[.][^@ ]+$')) %}
    Must be a valid email address
    {% endif %}

# ── Runtime ───────────────────────────────────────────────────────────────────
# Python / Spark / Delta versions are derived from the Databricks Runtime so that
# local tests run against the same stack as the cluster.

databricks_runtime:
  type: str
  help: "Databricks Runtime LTS version"
  default: "15.4"
  choices:
    "14.3 LTS (Spark 3.5, Python 3.10)": "14.3"
    "15.4 LTS (Spark 3.5, Python 3.11)": "15.4"
    "16.4 LTS (Spark 3.5, Python 3.12)": "16.4"
    "17.3 LTS (Spark 4.0, Python 3.12)": "17.3"
    "18 LTS (Spark 4.1, Python 3.12)": "18"

# ── Cloud / Databricks ────────────────────────────────────────────────────────

cloud_provider:
  type: str
  help: "Cloud provider hosting your Databricks workspace"
  default: "aws"
  choices:
    - aws
    - azure
    - gcp

databricks_host:
  type: str
  help: "Databricks workspace URL (https://xxx.cloud.databricks.com)"
  validator: >-
    {% if not (databricks_host | regex_search('^https://[^/ ]+/?$')) %}
    Must be an https URL without path (e.g. https://xxx.cloud.databricks.com)
    {% endif %}

unity_catalog_name:
  type: str
  help: "Unity Catalog catalog name"
  default: "{{ package_name }}"
  validator: >-
    {% if not (unity_catalog_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must contain only lowercase letters, digits and underscores
    {% endif %}

# ── Computed (hidden) ─────────────────────────────────────────────────────────
# Single source of truth for the stack of each runtime: add a new DBR here.

runtime:
  type: yaml
  when: false
  default: >-
    {%- set matrix = {
      "14.3": {"python": "3.10", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "scala": "2.12", "java": "17"},
      "15.4": {"python": "3.11", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "scala": "2.12", "java": "17"},
      "16.4": {"python": "3.12", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "scala": "2.12", "java": "17"},
      "17.3": {"python": "3.12", "pyspark": ">=4.0,<4.1", "delta": ">=4.0,<4.1", "scala": "2.13", "java": "17"},
      "18":   {"python": "3.12", "pyspark": ">=4.1,<4.2", "delta": ">=4.2,<4.3", "scala": "2.13", "java": "21"},
    } -%}
    {{ matrix[databricks_runtime] | to_json }}

default_node_type:
  type: str
  when: false
  default: >-
    {%- if cloud_provider == 'aws' -%}m5.xlarge
    {%- elif cloud_provider == 'azure' -%}Standard_DS3_v2
    {%- else -%}n2-standard-4
    {%- endif -%}
