_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.3.0"

# ── Project identity ──────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Customer Churn Prediction')"
  validator: >-
    {% if not project_name.strip() %}Project name cannot be empty{% endif %}
    {%- if '"' in project_name %}Project name cannot contain double quotes{% endif %}

project_slug:
  type: str
  help: "Bundle / repo slug — lowercase, alphanumeric, dashes only"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}
    Must start with a letter and contain only lowercase letters, digits and dashes
    {% endif %}

package_name:
  type: str
  help: "Python package name (snake_case, no dashes)"
  default: "{{ project_slug | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be a valid Python identifier: lowercase letters, digits and underscores
    {% endif %}

author_name:
  type: str
  help: "Your full name"

author_email:
  type: str
  help: "Your email address (receives job failure notifications)"
  validator: >-
    {% if not (author_email | regex_search('^[^@ ]+@[^@ ]+[.][^@ ]+$')) %}
    Must be a valid email address
    {% endif %}

# ── Databricks ────────────────────────────────────────────────────────────────

databricks_host:
  type: str
  help: "Databricks workspace URL (https://xxx.cloud.databricks.com)"
  validator: >-
    {% if not (databricks_host | regex_search('^https://[^/ ]+/?$')) %}
    Must be an https URL without path (e.g. https://xxx.cloud.databricks.com)
    {% endif %}

unity_catalog_name:
  type: str
  help: "Existing Unity Catalog catalog the job writes to (one schema per target is created in it)"
  default: "main"
  validator: >-
    {% if not (unity_catalog_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must contain only lowercase letters, digits and underscores
    {% endif %}

compute:
  type: str
  help: "Compute the job runs on"
  default: serverless
  choices:
    "Serverless (no cluster to manage)": serverless
    "Job cluster (classic compute, pinned DBR)": job_cluster

serverless_environment:
  type: str
  help: "Serverless environment version"
  when: "{{ compute == 'serverless' }}"
  default: "5"
  choices:
    "2 (Python 3.11, Spark 3.5)": "2"
    "3 (Python 3.12, Spark 3.5)": "3"
    "4 (Python 3.12, Spark 4.0)": "4"
    "5 (Python 3.12, Spark 4.1)": "5"

databricks_runtime:
  type: str
  help: "Databricks Runtime LTS version of the job cluster"
  when: "{{ compute == 'job_cluster' }}"
  default: "16.4"
  choices:
    "14.3 LTS (Spark 3.5, Python 3.10)": "14.3"
    "15.4 LTS (Spark 3.5, Python 3.11)": "15.4"
    "16.4 LTS (Spark 3.5, Python 3.12)": "16.4"
    "17.3 LTS (Spark 4.0, Python 3.12)": "17.3"
    "18 LTS (Spark 4.1, Python 3.12)": "18"

cloud_provider:
  type: str
  help: "Cloud provider hosting the workspace (sets the default node type)"
  when: "{{ compute == 'job_cluster' }}"
  default: aws
  choices:
    - aws
    - azure
    - gcp

# ── Computed (hidden) ─────────────────────────────────────────────────────────
# Single source of truth for the local stack matching the remote compute.
# Serverless environments map to the DBR they are built on. Add a new DBR here.

runtime:
  type: yaml
  when: false
  default: >-
    {%- set serverless_to_dbr = {"2": "15.4", "3": "16.4", "4": "17.3", "5": "18"} -%}
    {%- set dbr = serverless_to_dbr[serverless_environment] if compute == "serverless" else databricks_runtime -%}
    {%- set matrix = {
      "14.3": {"python": "3.10", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "dbconnect": ">=14.3,<14.4", "scala": "2.12", "java": "17"},
      "15.4": {"python": "3.11", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "dbconnect": ">=15.4,<15.5", "scala": "2.12", "java": "17"},
      "16.4": {"python": "3.12", "pyspark": ">=3.5,<3.6", "delta": ">=3.2,<3.4", "dbconnect": ">=16.4,<16.5", "scala": "2.12", "java": "17"},
      "17.3": {"python": "3.12", "pyspark": ">=4.0,<4.1", "delta": ">=4.0,<4.1", "dbconnect": ">=17.3,<17.4", "scala": "2.13", "java": "17"},
      "18":   {"python": "3.12", "pyspark": ">=4.1,<4.2", "delta": ">=4.2,<4.3", "dbconnect": ">=18.0,<19", "scala": "2.13", "java": "21"},
    } -%}
    {{ matrix[dbr] | to_json }}

default_node_type:
  type: str
  when: false
  default: >-
    {%- if cloud_provider == 'aws' -%}m5.xlarge
    {%- elif cloud_provider == 'azure' -%}Standard_DS3_v2
    {%- else -%}n2-standard-4
    {%- endif -%}
