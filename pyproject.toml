[project]
name = "pyspark-template"
version = "0.1.0"
description = "Copier template for PySpark + Databricks Asset Bundles (AWS, Azure, GCP)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "copier>=9.3",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = ["slow: renders a project and runs its unit tests (needs Java)"]

[tool.ruff]
line-length = 120
