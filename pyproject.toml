[project]
name = "databricks-pyspark-bundle-template"
version = "0.3.0"
description = "Copier template for PySpark jobs deployed with Databricks Asset Bundles"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.3",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = ["slow: renders a project and runs its unit tests (needs Java)"]
filterwarnings = ["ignore::copier.errors.DirtyLocalWarning"]

[tool.ruff]
line-length = 120
