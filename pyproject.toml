[project]
name = "pyspark-template"
version = "0.1.0"
description = "Copier template for PySpark + Databricks Asset Bundles (AWS)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "copier>=9.3",
    "pytest>=8.0",
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
